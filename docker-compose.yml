services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Values come from .env (local) / GitHub secrets (CI) — never committed
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set in .env}
      MYSQL_USER: ${MYSQL_USER:?set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    volumes:
      # SQL data lives on the host so it survives container restarts/removals
      - ./mysql-data:/var/lib/mysql
      # Creates the database and tables on first boot (runs schema.sql once)
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3306:3306"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:?set in .env}
      DB_USER: ${MYSQL_USER:?set in .env}
      DB_PASS: ${MYSQL_PASSWORD:?set in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
    volumes:
      # Uploaded images live on the host so they survive container restarts/removals
      - ./upload-data:/app/uploads
    ports:
      - "3000:3000"